# Codemagic CI/CD — builds the iOS app on a cloud Mac and ships it to App Store Connect.
# Everything here runs on Codemagic's macOS machines, so no Mac is needed on your side.
# Full setup steps are in IOS_APPSTORE_SETUP.md.
#
# One-time setup in the Codemagic UI before the first build:
#   1. Sign up at codemagic.io and connect this repo (viswachakra/viswachakra_mobile).
#   2. Teams -> Integrations -> App Store Connect: add an API key
#      (from App Store Connect -> Users and Access -> Integrations, "App Manager" role).
#      Name that integration exactly:  codemagic   (or change `app_store_connect:` below).
#   3. In App Store Connect create the app record with bundle id
#      com.vvistech.viswachakraMobile  and copy its numeric Apple ID into APP_STORE_APP_ID.

workflows:
  ios-appstore:
    name: iOS — App Store
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic          # name of your App Store Connect API key in Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store        # automatic signing via the ASC API key above
        bundle_identifier: com.vvistech.viswachakraMobile
      vars:
        APP_STORE_APP_ID: 6817792157         # Viswachakra Claims in App Store Connect
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Set up provisioning profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          # keep TestFlight build numbers monotonically increasing
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0) + 1))
          echo "Building build number $BUILD_NUMBER"
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - admin@vvistech.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true          # every build goes to TestFlight for testing
        # submit_to_app_store: true         # uncomment to auto-submit for App Store review
        # release_type: MANUAL              # then you release manually from App Store Connect
